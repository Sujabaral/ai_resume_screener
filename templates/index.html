<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDAS — AI Resume Screener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F3EE;
      --surface: #FFFFFF;
      --surface-2: #F0EDE7;
      --border: rgba(0,0,0,0.09);
      --border-strong: rgba(0,0,0,0.16);
      --text: #1A1814;
      --text-2: #6B6660;
      --text-3: #A09B96;
      --accent: #2B2622;
      --accent-hover: #3D3732;
      --radius: 10px;
      --radius-lg: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      animation: fadeUp .4s ease both;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg { display: block; }

    .logo-text {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .04em;
      color: var(--text);
    }

    .logo-text span {
      color: var(--text-3);
      font-weight: 400;
    }

    .header-badge {
      font-size: 11px;
      font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 4px 10px;
      color: var(--text-2);
      font-family: 'DM Mono', monospace;
      letter-spacing: .03em;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      animation: fadeUp .5s .05s ease both;
    }

    /* Section */
    .section {
      padding: 1.5rem 1.75rem;
    }

    .section + .section {
      border-top: 1px solid var(--border);
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .section-num {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      min-width: 18px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

    /* Fields */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field + .field { margin-top: 14px; }

    .field label {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 400;
    }

    .field input,
    .field textarea {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 13px;
      outline: none;
      transition: border-color .15s, background .15s;
      width: 100%;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--border-strong);
      background: #fff;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--text-3);
    }

    .field textarea {
      resize: vertical;
      min-height: 88px;
      line-height: 1.6;
    }

    .field textarea.tall { min-height: 130px; }

    .field-hint {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }

    /* Upload */
    .upload-zone {
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 2.25rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      position: relative;
    }

    .upload-zone:hover {
      background: var(--surface-2);
      border-color: var(--accent);
    }

    .upload-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      width: 42px;
      height: 42px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    .upload-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }

    .upload-sub {
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 12px;
    }

    .upload-tags {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--text-2);
    }

    .file-list {
      margin-top: 14px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text-2);
      text-align: left;
    }

    .file-item svg { flex-shrink: 0; }
    .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { color: var(--text-3); font-family: 'DM Mono', monospace; font-size: 11px; }

    /* Footer */
    .footer {
      padding: 1.25rem 1.75rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg);
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-3);
    }

    .btn-row { display: flex; gap: 8px; }

    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid var(--border-strong);
      transition: all .15s;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-2);
    }

    .btn-ghost:hover { background: var(--surface-2); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-primary svg { transition: transform .15s; }
    .btn-primary:hover svg { transform: translateX(2px); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 520px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .footer { flex-direction: column; align-items: stretch; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <div class="logo">
      <div class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="white" opacity=".9"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="white" opacity=".5"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".5"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="white" opacity=".25"/>
        </svg>
      </div>
      <span class="logo-text">MIDAS <span>/ resume screener</span></span>
    </div>
    <span class="header-badge">AI-powered</span>
  </header>

  <form class="card" method="POST" enctype="multipart/form-data" action="/">

    <!-- 01 Role -->
    <div class="section">
      <div class="section-head">
        <span class="section-num">01</span>
        <span class="section-title">Role details</span>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="job_title">Job title</label>
          <input type="text" id="job_title" name="job_title" placeholder="Software Engineer" required>
        </div>
        <div class="field">
          <label for="required_years">Years of experience</label>
          <input type="number" id="required_years" name="required_years" placeholder="2" min="0" required>
        </div>
      </div>
      <div class="field">
        <label for="qualification">Required qualification</label>
        <input type="text" id="qualification" name="qualification" placeholder="Bachelor in Computer Engineering">
      </div>
    </div>

    <!-- 02 Skills -->
    <div class="section">
      <div class="section-head">
        <span class="section-num">02</span>
        <span class="section-title">Skills</span>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="required_skills">Required skills</label>
          <textarea id="required_skills" name="required_skills" placeholder="Python, Django, SQL, REST API, Communication"></textarea>
          <p class="field-hint">Comma-separated · higher match weight</p>
        </div>
        <div class="field">
          <label for="preferred_skills">Preferred skills</label>
          <textarea id="preferred_skills" name="preferred_skills" placeholder="Docker, AWS, React, Leadership"></textarea>
          <p class="field-hint">Comma-separated · lower match weight</p>
        </div>
      </div>
    </div>

    <!-- 03 Job description -->
    <div class="section">
      <div class="section-head">
        <span class="section-num">03</span>
        <span class="section-title">Job description</span>
      </div>
      <div class="field">
        <label for="job_description">Full JD for semantic matching</label>
        <textarea id="job_description" name="job_description" class="tall" placeholder="Paste the complete job description here. The more detail you provide, the more accurate the AI semantic ranking will be."></textarea>
      </div>
    </div>

    <!-- 04 Upload -->
    <div class="section">
      <div class="section-head">
        <span class="section-num">04</span>
        <span class="section-title">Upload resumes</span>
      </div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" name="resumes" id="resumeInput" accept=".pdf,.docx" multiple required>
        <div class="upload-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#6B6660" stroke-width="1.5">
            <path d="M9 12V4M6 7l3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 14v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="upload-title">Drop CVs here or click to browse</p>
        <p class="upload-sub">Upload 50+ files at once</p>
        <div class="upload-tags">
          <span class="tag">PDF</span>
          <span class="tag">DOCX</span>
        </div>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-note" id="footerNote">No files selected</span>
      <div class="btn-row">
        <button type="reset" class="btn btn-ghost" onclick="clearFiles()">Clear</button>
        <button type="submit" class="btn btn-primary">
          Screen candidates
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2.5 7h9M8 3.5l3.5 3.5L8 10.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

  </form>
</div>

<script>
  const input = document.getElementById('resumeInput');
  const list = document.getElementById('fileList');
  const note = document.getElementById('footerNote');

  function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(0) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  input.addEventListener('change', () => {
    const files = Array.from(input.files);
    if (!files.length) { list.style.display = 'none'; note.textContent = 'No files selected'; return; }

    note.textContent = files.length + ' file' + (files.length > 1 ? 's' : '') + ' selected';
    list.style.display = 'flex';
    list.innerHTML = files.slice(0, 8).map(f => `
      <div class="file-item">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#A09B96" stroke-width="1.3">
          <path d="M7.5 1H3a1 1 0 00-1 1v9a1 1 0 001 1h7a1 1 0 001-1V4.5L7.5 1z" stroke-linejoin="round"/>
          <path d="M7.5 1v3.5H11" stroke-linejoin="round"/>
        </svg>
        <span class="file-name">${f.name}</span>
        <span class="file-size">${formatBytes(f.size)}</span>
      </div>
    `).join('') + (files.length > 8 ? `<div class="file-item" style="justify-content:center;color:var(--text-3)">+${files.length - 8} more files</div>` : '');
  });

  function clearFiles() {
    list.style.display = 'none';
    list.innerHTML = '';
    note.textContent = 'No files selected';
  }
</script>
</body>
</html>
